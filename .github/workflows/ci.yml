name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - docs/**
      - examples/**/*.md
      - packages/*/README.md
      - LICENSE
      - packages/*/LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths-ignore:
      - "*.md"
      - docs/**
      - examples/**/*.md
      - packages/*/README.md
      - LICENSE
      - packages/*/LICENSE
      - .github/ISSUE_TEMPLATE/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The supported range is engines >=22: the oldest supported LTS, the
        # development default from .nvmrc, and the newest release.
        node-version: [22, 24, latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
