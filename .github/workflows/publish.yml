name: Publish Packages

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package versions match release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");

          const releaseTag = process.env.RELEASE_TAG;
          const normalizedTag = releaseTag.replace(/^v/, "");

          const packagePaths = [
            "packages/core/package.json",
            "packages/aws/package.json",
            "packages/twilio/package.json",
          ];

          const packages = packagePaths.map((packagePath) => {
            const fullPath = path.join(process.cwd(), packagePath);
            const pkg = JSON.parse(fs.readFileSync(fullPath, "utf8"));
            return {
              path: packagePath,
              name: pkg.name,
              version: pkg.version,
              dependencies: pkg.dependencies ?? {},
            };
          });

          const versionMismatches = packages.filter(
            (pkg) => pkg.version !== normalizedTag,
          );

          if (versionMismatches.length > 0) {
            console.error(
              `Release tag ${releaseTag} does not match package versions:`,
            );
            for (const pkg of versionMismatches) {
              console.error(`- ${pkg.name} (${pkg.path}) is ${pkg.version}`);
            }
            process.exit(1);
          }

          const expectedCoreRange = `^${normalizedTag}`;
          for (const pkg of packages) {
            if (pkg.name === "@seamless-auth/messaging") {
              continue;
            }

            const actualCoreRange = pkg.dependencies["@seamless-auth/messaging"];
            if (actualCoreRange !== expectedCoreRange) {
              console.error(
                `${pkg.name} must depend on @seamless-auth/messaging@${expectedCoreRange}, found ${actualCoreRange ?? "undefined"}`,
              );
              process.exit(1);
            }
          }

          console.log(
            `Release tag ${releaseTag} matches all package versions (${normalizedTag}).`,
          );
          EOF

      - name: Verify release
        run: npm run release:verify

      - name: Publish core package
        run: npm publish --workspace packages/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish AWS package
        run: npm publish --workspace packages/aws --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Twilio package
        run: npm publish --workspace packages/twilio --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
